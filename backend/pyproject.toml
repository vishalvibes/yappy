[project]
name = "yappy-backend"
version = "0.1.0"
description = "FastAPI backend for Yappy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.30.6",
    "supabase>=2.27.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.8.0",
    "inngest>=0.5.19",
    "openai>=2.46.0",
    "ddgs>=9.14.4",
    "tavily-python>=0.7.26",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]
test = [
    "deepdiff>=8.0.0",
    "psycopg2-binary>=2.9.0",
    "pyjwt>=2.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "pytest-xdist>=3.0.0",
    "pyyaml>=6.0.0",
    "testcontainers[postgres]>=4.0.0",
]

[tool.uv]
# Install dev + test tooling on a plain `uv sync`.
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Fast unit tests (<100ms each)",
    "integration: Integration tests against a real local Supabase",
    "smoke: Critical path tests (run on every commit)",
]

# Ruff runs on defaults (matches harmony-fragment house style — no custom rule set).
